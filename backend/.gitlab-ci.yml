variables:
  VERSION: 1.0.${CI_PIPELINE_ID}

stages:
   - build
   - build-docker
   - release
   - deploy

build-code-job:
  stage: build
  image: golang:1.17
  variables:
    GOPATH: $CI_PROJECT_DIR/backend/.go
    CGO_ENABLED: "0"
    GIT_DEPTH: "0"
  before_script:
    - mkdir -p backend/.go
  script:
    - cd backend/cmd/api/
    - go build .
    - mkdir -p $CI_PROJECT_DIR/momo-store-${VERSION}
    - mv api $CI_PROJECT_DIR/momo-store-${VERSION}/
  cache:
    key: $CI_COMMIT_REF_SLUG
    paths:
      - backend/.go/pkg/mod/
  artifacts:
    paths:
      - momo-store-${VERSION}/api


build-backend-docker:
  stage: build_image
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  script:
    - mv momo-store-${VERSION}/api backend/
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"${CI_REGISTRY}\":{\"auth\":\"$(printf "%s:%s" "${CI_REGISTRY_USER}" "${CI_REGISTRY_PASSWORD}" | base64 | tr -d '\n')\"}}}" > /kaniko/.docker/config.json
    - >-
      /kaniko/executor
      --context ${CI_PROJECT_DIR}/backend
      --dockerfile ${CI_PROJECT_DIR}/backend/Dockerfile
      --destination ${CI_REGISTRY_IMAGE}/momo-backend:${VERSION}
      --build-arg VERSION=${VERSION}
      --cache=true
      --cache-copy-layers

release:
  stage: release
  variables:
    GIT_STRATEGY: none
  image:
    name: gcr.io/go-containerregistry/crane:debug
    entrypoint: [ "" ]
  cache: [ ]
  before_script:
    - crane auth login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - crane tag $CI_REGISTRY_IMAGE/momo-backend_SHA $VERSION
  only:
    changes:
      - backend/**/*

deploy:
  stage: deploy
  image: docker:28.3.3
  environment:
    name: production/backend
  before_script:
#    - apk add vault
    - apk add jq
    - apk add curl
    - apk add openssh-client bash
    - apk add --no-cache gettext
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - echo "$SSH_KNOWN_HOSTS" >> ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
    - docker context create remote --description "remote ssh" --docker "host=ssh://${DEV_USER}@${DEV_HOST}"
  
  script:
    - export VAULT_TOKEN=$(curl -s -X POST --data "{\"jwt\":\"$CI_JOB_JWT\",\"role\":\"sausage-store\"}" "$VAULT_ADDR/v1/auth/jwt/login" | jq -r '.auth.client_token')
    - echo "SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL}" >> deploy.env
    - echo "SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME}" >> deploy.env
    - echo "SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD}" >> deploy.env
    - echo "SPRING_DATA_MONGODB_URI=${SPRING_DATA_MONGODB_URI}" >> deploy.env
    - echo "REPORT_PATH=${REPORT_PATH}" >> deploy.env
    - echo "LOG_PATH=${LOG_PATH}" >> deploy.env
    - echo "REPORTS_MONGODB_URI=${REPORTS_MONGODB_URI}" >> deploy.env
    - echo "SPRING_CLOUD_VAULT_TOKEN=${VAULT_TOKEN}" >> deploy.env
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - bash ./backend/deploy.sh
    
    #- docker --context remote compose --env-file deploy.env up backend -d --pull "always" --force-recreate 







