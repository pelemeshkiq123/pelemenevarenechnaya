variables:
  VERSION: 1.0.${CI_PIPELINE_ID}

stages:
   - build
   - docker-build
   - release
   - deploy-backend

build-code-job:
  stage: build
  image: golang:1.17
  variables:
    GOPATH: $CI_PROJECT_DIR/backend/.go
    CGO_ENABLED: "0"
    GIT_DEPTH: "0"
  before_script:
    - mkdir -p backend/.go
  script:
    - cd backend/cmd/api/
    - go build .
    - mkdir -p $CI_PROJECT_DIR/momo-store-${VERSION}
    - mv api $CI_PROJECT_DIR/momo-store-${VERSION}/
  cache:
    key: $CI_COMMIT_REF_SLUG
    paths:
      - backend/.go/pkg/mod/
  artifacts:
    paths:
      - momo-store-${VERSION}/api

# НОВАЯ JOB: Сборка Docker-образа
build-docker-image:
  stage: docker-build
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  dependencies:
    - build-code-job
  before_script:
    - |
      echo "=== Creating Dockerfile ==="
      # Используем wildcard вместо переменной
      cat > Dockerfile << 'EOF'
      FROM alpine:latest
      WORKDIR /app
      COPY momo-store-*/api /app/api
      RUN chmod +x /app/api
      EXPOSE 8081
      CMD ["/app/api"]
      EOF
            
      echo "Dockerfile content:"
      cat Dockerfile
      echo "Available momo-store directories:"
      find . -name "momo-store-*" -type d
      echo "API binary exists:"
      find . -name api -type f
  script:
    - |
      /kaniko/executor \
        --context "." \
        --dockerfile "Dockerfile" \
        --destination "${CI_REGISTRY_IMAGE}/momo-backend:${CI_COMMIT_SHORT_SHA}" \
        --verbosity=info
  only:
    changes:
      - backend/**/*

release:
  stage: release
  variables:
    GIT_STRATEGY: none
  image:
    name: gcr.io/go-containerregistry/crane:debug
    entrypoint: [ "" ]
  cache: [ ]
  dependencies:
    - build-docker-image  # Важно: зависимость от сборки образа
  before_script:
    - crane auth login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - crane tag $CI_REGISTRY_IMAGE/momo-backend:$CI_COMMIT_SHORT_SHA $VERSION
    - crane tag $CI_REGISTRY_IMAGE/momo-backend:$CI_COMMIT_SHORT_SHA latest
    - echo "Successfully tagged $CI_REGISTRY_IMAGE/momo-backend:$VERSION"
  only:
    changes:
      - backend/**/*

deploy-backend:
  stage: deploy-backend
  image: bitnami/kubectl:latest
  before_script:
    - |
      kubectl config set-cluster k8smomok8s \
        --server=https://158.160.204.226 \
        --insecure-skip-tls-verify=true
      
      kubectl config set-credentials gitlab-ci-user \
        --token="$KUBE_TOKEN"
      
      kubectl config set-context production \
        --cluster=k8smomok8s \
        --user=gitlab-ci-user
      
      kubectl config use-context production
  script:
    - |
      kubectl get nodes
      kubectl apply -f infrastructure/k8s/backend/
      sleep 10
      kubectl rollout status deployment/momo-backend --timeout=300s