variables:
  VERSION: 1.0.${CI_PIPELINE_ID}

stages:
   - build
   - docker-build
   - release
   - deploy-backend

build-code-job:
  stage: build
  image: golang:1.17
  variables:
    GOPATH: $CI_PROJECT_DIR/backend/.go
    CGO_ENABLED: "0"
    GIT_DEPTH: "0"
  before_script:
    - mkdir -p backend/.go
  script:
    - cd backend/cmd/api/
    - go build .
    - mkdir -p $CI_PROJECT_DIR/momo-store-${VERSION}
    - mv api $CI_PROJECT_DIR/momo-store-${VERSION}/
  cache:
    key: $CI_COMMIT_REF_SLUG
    paths:
      - backend/.go/pkg/mod/
  artifacts:
    paths:
      - momo-store-${VERSION}/api

# НОВАЯ JOB: Сборка Docker-образа
build-docker-image:
  stage: docker-build
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  dependencies:
    - build-code-job
  before_script:
    - |
      echo "=== Creating Dockerfile ==="
      # Используем wildcard вместо переменной
      cat > Dockerfile << 'EOF'
      FROM alpine:latest
      WORKDIR /app
      COPY momo-store-*/api /app/api
      RUN chmod +x /app/api
      EXPOSE 8080
      CMD ["/app/api"]
      EOF
            
      echo "Dockerfile content:"
      cat Dockerfile
      echo "Available momo-store directories:"
      find . -name "momo-store-*" -type d
      echo "API binary exists:"
      find . -name api -type f
  script:
    - |
      /kaniko/executor \
        --context "." \
        --dockerfile "Dockerfile" \
        --destination "${CI_REGISTRY_IMAGE}/momo-backend:${CI_COMMIT_SHORT_SHA}" \
        --verbosity=info
  only:
    changes:
      - backend/**/*

release:
  stage: release
  variables:
    GIT_STRATEGY: none
  image:
    name: gcr.io/go-containerregistry/crane:debug
    entrypoint: [ "" ]
  cache: [ ]
  dependencies:
    - build-docker-image  # Важно: зависимость от сборки образа
  before_script:
    - crane auth login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - crane tag $CI_REGISTRY_IMAGE/momo-backend:$CI_COMMIT_SHORT_SHA $VERSION
    - echo "Successfully tagged $CI_REGISTRY_IMAGE/momo-backend:$VERSION"
  only:
    changes:
      - backend/**/*

deploy-backend:
  stage: deploy-backend
  image: 
    name: bitnami/kubectl:latest
    entrypoint: [""]
  before_script:
    - |
      mkdir -p ~/.kube
      echo "$KUBE_CONFIG" > ~/.kube/config
      kubectl cluster-info
  script:
    - |
      echo "Deploying Backend..."
      # Заменяем переменную в манифесте
      sed "s/\${CI_PIPELINE_ID}/${CI_PIPELINE_ID}/g" k8s/backend/deployment.yaml | kubectl apply -f -
      kubectl apply -f infrastructure/k8s/backend/service.yaml
      
      # Ждем готовности бэкенда
      kubectl rollout status deployment/momo-backend --timeout=300s
      
      echo "Backend deployed successfully!"
  dependencies:
    - release  # Зависит от тегирования образа
  environment:
    name: production