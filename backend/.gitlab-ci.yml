variables:
  VERSION: 1.0.${CI_PIPELINE_ID}

stages:
   - build
   - docker-build
   - release

build-code-job:
  stage: build
  image: golang:1.17
  variables:
    GOPATH: $CI_PROJECT_DIR/backend/.go
    CGO_ENABLED: "0"
    GIT_DEPTH: "0"
  before_script:
    - mkdir -p backend/.go
  script:
    - cd backend/cmd/api/
    - go build .
    - mkdir -p $CI_PROJECT_DIR/momo-store-${VERSION}
    - mv api $CI_PROJECT_DIR/momo-store-${VERSION}/
  cache:
    key: $CI_COMMIT_REF_SLUG
    paths:
      - backend/.go/pkg/mod/
  artifacts:
    paths:
      - momo-store-${VERSION}/api

# НОВАЯ JOB: Сборка Docker-образа
build-docker-image:
  stage: docker-build
  image: docker:latest
  services:
    - docker:dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  dependencies:
    - build-code-job
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - |
      cat > Dockerfile << 'EOF'
      FROM alpine:latest
      WORKDIR /app
      COPY momo-store-${VERSION}/api /app/
      EXPOSE 8080
      CMD ["/app/api"]
      EOF
    - docker build -t $CI_REGISTRY_IMAGE/momo-backend:$CI_COMMIT_SHORT_SHA .
    - docker push $CI_REGISTRY_IMAGE/momo-backend:$CI_COMMIT_SHORT_SHA
    - echo "Docker image pushed: $CI_REGISTRY_IMAGE/momo-backend:$CI_COMMIT_SHORT_SHA"
  artifacts:
    reports:
      dotenv: build.env
  only:
    changes:
      - backend/**/*

release:
  stage: release
  variables:
    GIT_STRATEGY: none
  image:
    name: gcr.io/go-containerregistry/crane:debug
    entrypoint: [ "" ]
  cache: [ ]
  dependencies:
    - build-docker-image  # Важно: зависимость от сборки образа
  before_script:
    - crane auth login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - crane tag $CI_REGISTRY_IMAGE/momo-backend:$CI_COMMIT_SHORT_SHA $VERSION
    - echo "Successfully tagged $CI_REGISTRY_IMAGE/momo-backend:$VERSION"
  only:
    changes:
      - backend/**/*