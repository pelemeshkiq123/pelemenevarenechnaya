deploy-frontend:
  stage: deploy-frontend
  image: bitnami/kubectl:latest
  before_script:
    - |
      kubectl config set-cluster k8smomok8s \
        --server=https://158.160.204.226 \
        --insecure-skip-tls-verify=true
      
      kubectl config set-credentials gitlab-ci-user \
        --token="$KUBE_TOKEN"
      
      kubectl config set-context production \
        --cluster=k8smomok8s \
        --user=gitlab-ci-user
      
      kubectl config use-context production
  script:
    - |
      kubectl get nodes
      kubectl apply -f infrastructure/k8s/frontend/
      kubectl rollout status deployment/momo-frontend --timeout=300s