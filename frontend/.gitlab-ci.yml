cache:
  paths:
    - frontend/dist/frontend

variables:
  VERSION: 1.0.${CI_PIPELINE_ID}

stages:
   - build
   - release
   - deploy-frontend

build:
   stage: build
   image:
      name: gcr.io/kaniko-project/executor:v1.9.0-debug
      entrypoint: [""]
   script:
      - /kaniko/executor
         --context "${CI_PROJECT_DIR}/frontend"
         --dockerfile "${CI_PROJECT_DIR}/frontend/Dockerfile"
         --destination "${CI_REGISTRY_IMAGE}/momo-frontend:$CI_COMMIT_SHA"
         --build-arg VERSION=$VERSION
         --cache=true
   only:
     changes:
     - frontend/**/*

release:
  stage: release
  image:
    name: gcr.io/go-containerregistry/crane:debug
    entrypoint: [ "" ]
  variables:
    GIT_STRATEGY: none
  cache: [ ]
  script:
    - crane auth login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - crane tag $CI_REGISTRY_IMAGE/momo-frontend:$VERSION  
    - crane tag $CI_REGISTRY_IMAGE/momo-frontend:$CI_COMMIT_SHA latest 
  only:
    changes:
      - frontend/**/*

deploy-frontend:
  stage: deploy-frontend
  image: 
    name: bitnami/kubectl:latest
    entrypoint: [""]
  before_script:
    - |
      mkdir -p ~/.kube
      echo "$KUBE_CONFIG" > ~/.kube/config
  script:
    - |
      echo "Deploying Frontend..."
      kubectl apply -f k8s/frontend/deployment.yaml
      kubectl apply -f k8s/frontend/service.yaml
      
      # Ждем готовности фронтенда
      kubectl rollout status deployment/momo-frontend --timeout=300s
      
      echo "Frontend deployed successfully!"
  dependencies:
    - deploy-backend  # Сначала должен быть развернут бэкенд
  environment:
    name: production