apiVersion: apps/v1
kind: Deployment
metadata:
  name: momo-backend
  namespace: default
  labels:
    app: momo-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: momo-backend
  template:
    metadata:
      labels:
        app: momo-backend
    spec:
      containers:
      - name: backend
        image: gitlab.praktikum-services.ru:5050/std-int-005-013/varenikilife/momo-backend:latest
        imagePullPolicy: IfNotPresent
        resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
        ports:
        - containerPort: 8080
        env:
        - name: ENVIRONMENT
          value: "production"
      imagePullSecrets:
      - name: gitlab-registry