apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: default
data:
  default.conf: |
    server {

      listen 80;

      location = / {
        return 302 /momo-store/;
      }
      
      location /momo-store/ {
        try_files $uri $uri/ /momo-store/index.html;
      }

      error_page   500 502 503 504  /50x.html;
      location = /50x.html {
        root   /usr/share/nginx/html;
      }

      location ~ ^/(categories|products|auth|metrics|orders)/ {
        proxy_pass http://momo-backend-service:8081;
      }

      location /stub_status {
        allow 127.0.0.1;
        deny all;
        stub_status on;
      }
    }