apiVersion: apps/v1
kind: Deployment
metadata:
  name: momo-frontend
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: momo-frontend
  template:
    metadata:
      labels:
        app: momo-frontend
    spec:
      containers:
      - name: momo-frontend
        image: gitlab.praktikum-services.ru:5050/std-int-005-013/varenikilife/momo-frontend:latest
        imagePullPolicy: IfNotPresent
        resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
        ports:
        - containerPort: 80
        env:
        - name: VUE_APP_API_URL
          value: "http://localhost:8081"
      imagePullSecrets:
      - name: gitlab-registry