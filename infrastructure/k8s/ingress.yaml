apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: momo-ingress-ip
  namespace: default
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: momo-frontend-service
            port:
              number: 80
      - path: /whoami
        pathType: Prefix
        backend:
          service:
            name: momo-backend-service
            port:
              number: 8081
      - path: /products
        pathType: Prefix
        backend:
          service:
            name: momo-backend-service
            port:
              number: 8081
      - path: /categories
        pathType: Prefix
        backend:
          service:
            name: momo-backend-service
            port:
              number: 8081
      - path: /auth
        pathType: Prefix
        backend:
          service:
            name: momo-backend-service
            port:
              number: 8081