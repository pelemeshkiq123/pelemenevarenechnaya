apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: momo-ingress
  namespace: default
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"  # для SSL
spec:
  tls:
  - hosts:
    - vareniki4ever.ru  # ← ваш домен
    secretName: momo-tls-secret
  rules:
  - host: vareniki4ever.ru  # ← ваш домен
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: momo-frontend-service
            port:
              number: 80
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: momo-backend-service
            port:
              number: 8081